<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RPGMT</title>
<style>
  :root { --bg:#14121f; --panel:#1f1b33; --border:#5b4f9e; --text:#f1eefc; --muted:#a59fc4;
          --accent:#7c6cff; --ok:#3ecf8e; --warn:#f2b84b; }
  * { box-sizing: border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.5 system-ui, sans-serif;
         display:flex; justify-content:center; padding:16px; }
  main { width:100%; max-width:1100px; display:flex; flex-direction:column; gap:12px; }
  #join { display:flex; gap:8px; flex-wrap:wrap; }
  input[type=text] { flex:1; min-width:0; padding:12px; border-radius:8px; border:1px solid var(--border);
          background:var(--panel); color:var(--text); font-size:16px; }
  button { border:0; border-radius:12px; background:var(--accent); color:#fff; font-weight:700;
           cursor:pointer; font-family:inherit; }
  #joinBtn { padding:12px 20px; font-size:16px; }
  #game { display:flex; flex-direction:column; gap:12px; }
  #screen { position:relative; border-radius:12px; overflow:hidden; border:2px solid var(--border);
            background:#000; cursor:crosshair; line-height:0; }
  #screen img, #screen video { width:100%; height:auto; max-height:70vh; object-fit:contain; display:block;
                               user-select:none; -webkit-user-drag:none; background:#000; }
  #screen .hint { position:absolute; left:calc(var(--gl, 0px) + 8px); top:calc(var(--gt, 0px) + 8px); line-height:1.4; font-size:12px; padding:2px 8px;
                  border-radius:6px; background:rgba(20,18,31,.8); color:var(--muted); pointer-events:none; }
  #unmute { position:absolute; inset:0; margin:auto; width:max-content; height:max-content; line-height:1.4;
            padding:12px 20px; font-size:16px; }
  .ripple { position:absolute; width:36px; height:36px; margin:-18px 0 0 -18px; border-radius:50%;
            border:3px solid var(--c); pointer-events:none; animation:ripple .6s ease-out forwards; }
  @keyframes ripple { from { transform:scale(.3); opacity:1; } to { transform:scale(1.6); opacity:0; } }
  #players { list-style:none; margin:0; padding:0; display:flex; flex-wrap:wrap; gap:8px; }
  #players li { padding:4px 12px; border-radius:999px; background:var(--panel); border:1px solid var(--border); font-size:14px; }
  #players li.read { border-color:var(--ok); color:var(--ok); }
  #players li.wait { border-color:var(--warn); color:var(--warn); }
  #stage { display:flex; gap:12px; align-items:stretch; flex-wrap:wrap; }
  #stage #screen { flex:3 1 480px; min-width:0; }
  #chat { flex:1 1 240px; min-width:220px; max-height:70vh; display:flex; flex-direction:column;
          background:var(--panel); border:2px solid var(--border); border-radius:12px; overflow:hidden; }
  #chat h2 { margin:0; padding:8px 12px; font-size:13px; color:var(--muted); border-bottom:1px solid var(--border); }
  #chatLog { flex:1; min-height:140px; overflow-y:auto; padding:8px 12px; font-size:14px; line-height:1.45;
             overflow-wrap:anywhere; }
  #chatLog .msg { margin:0 0 4px; }
  #chatLog .who { font-weight:700; margin-right:4px; }
  #chatLog .msg:not(.cont) { margin-top:6px; }
  #chatLog .cont { margin-top:-2px; padding-left:14px; }
  #chatLog .empty { color:var(--muted); font-style:italic; }
  #chatForm { display:flex; gap:6px; padding:8px; border-top:1px solid var(--border); }
  #chatInput { flex:1; min-width:0; padding:8px 10px; border-radius:8px; border:1px solid var(--border);
               background:var(--bg); color:var(--text); font-size:14px; font-family:inherit; }
  #chatForm button { padding:0 12px; font-size:14px; }
  #status { color:var(--muted); font-size:14px; }
  #status:empty { display:none; }
  /* Sits in the game picture's bottom-left corner (offsets set by placeOverlays()). */
  #controls { position:absolute; left:calc(var(--gl, 0px) + 8px); bottom:calc(var(--gb, 0px) + 8px);
              display:flex; align-items:center; gap:6px; padding:4px 6px; line-height:normal;
              border-radius:10px; background:rgba(20,18,31,.78); cursor:default;
              opacity:0; pointer-events:none; transition:opacity .2s; }
  #controls.near { opacity:1; pointer-events:auto; }
  #ink { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
  #screen { touch-action:none; }
  #controls .tool { padding:4px 9px; font-size:14px; background:var(--panel); border:1px solid var(--border);
                   color:var(--text); border-radius:8px; white-space:nowrap; }
  #controls .tool.off { color:var(--muted); border-style:dashed; }
  #vol { width:90px; accent-color:var(--accent); }
  #screen .hint.need { background:var(--accent); color:#fff; font-weight:700; font-size:13px; }
  #screen .hint.done { background:var(--ok); color:#0d2b1f; font-weight:700; }
  .hidden { display:none !important; }
</style>
</head>
<body>
<main>

  <section id="join">
    <input id="name" type="text" maxlength="24" placeholder="Your name" autocomplete="nickname">
    <input id="code" type="text" maxlength="6" placeholder="Lobby code" autocomplete="off"
           style="flex:0 1 140px; text-transform:uppercase; letter-spacing:2px">
    <button id="joinBtn">Join</button>
  </section>

  <section id="game" class="hidden">
    <div id="stage">
    <div id="screen" class="hidden">
      <video id="video" class="hidden" playsinline autoplay></video>
      <img id="frame" alt="Live view of the game - click to ping">
      <canvas id="ink"></canvas>
      <span class="hint hidden" id="hint"></span>
      <div id="controls">
        <button id="muteBtn" class="tool" title="Mute / unmute the game">&#128266;</button>
        <input id="vol" type="range" min="0" max="1" step="0.05" value="1" title="Game volume">
        <button id="chatBtn" class="tool" title="Show / hide the chat">&#128172;</button>
      </div>
      <button id="unmute" class="hidden">&#128266; Click to turn on game sound</button>
    </div>
    <aside id="chat">
      <h2>Chat</h2>
      <div id="chatLog"><p class="empty">No messages yet. Say hi!</p></div>
      <form id="chatForm" autocomplete="off">
        <input id="chatInput" type="text" maxlength="200" placeholder="Message">
        <button type="submit">Send</button>
      </form>
    </aside>
    </div>
    <ul id="players"></ul>
  </section>

  <div id="status">Connecting&hellip;</div>
</main>
<script>
const $ = (id) => document.getElementById(id);
const params = new URLSearchParams(location.search);
let ws = null, myId = null, state = null, myName = "", myCode = "", myToken = "", rejected = false;
let pc = null, live = false, framesOn = false, retryTimer = null;

$("code").value = params.get("code") || "";
try {
  $("name").value = params.get("name") || localStorage.getItem("rpgmt-name") || "";
  $("vol").value = localStorage.getItem("rpgmt-volume") ?? "1";
} catch (e) {}
$("status").textContent = "Enter your name and join.";

// --- lobby connection ----------------------------------------------------
function connect() {
  const proto = location.protocol === "https:" ? "wss:" : "ws:";
  ws = new WebSocket(`${proto}//${location.host}/ws`);
  ws.onopen = () => ws.send(JSON.stringify({ type: "join", name: myName, code: myCode }));
  ws.onmessage = (ev) => {
    const data = JSON.parse(ev.data);
    if (data.type === "join-error") {
      rejected = true;
      $("game").classList.add("hidden");
      $("join").classList.remove("hidden");
      $("status").textContent = data.error === "full" ? "This lobby is full."
        : "Wrong lobby code. Check the link or code the host sent you.";
      return;
    }
    if (data.type === "welcome") {
      myId = data.id;
      myToken = data.token || "";
      myName = data.name || myName;
      $("chatLog").replaceChildren();
      (data.chat || []).forEach(addChat);
      if (!(data.chat || []).length) $("chatLog").innerHTML = '<p class="empty">No messages yet. Say hi!</p>';
      startStream();
    }
    if (data.type === "chat") addChat(data);
    if (data.type === "state") { state = data; render(); }
    if (data.type === "offer") onOffer(data);
    if (data.type === "stream-error") streamFailed();
  };
  ws.onclose = () => {
    myId = null;
    stopStream();
    if (rejected) return;  // wrong code / full: wait for the person to try again
    $("status").textContent = "Disconnected - reconnecting...";
    setTimeout(connect, 2000);
  };
}

// --- live video + sound (WebRTC) -------------------------------------------
function startStream() {
  clearTimeout(retryTimer);
  if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: "stream-request" }));
  retryTimer = setTimeout(() => { if (!live) streamFailed(); }, 12000);
}

function stopStream() {
  if (pc) { pc.close(); pc = null; }
  setLive(false);
}

async function onOffer(offer) {
  if (pc) pc.close();
  pc = new RTCPeerConnection({ iceServers: (offer.iceServers || []).map((u) => ({ urls: u })) });
  const media = new MediaStream();
  pc.ontrack = (e) => {
    media.addTrack(e.track);
    const v = $("video");
    if (v.srcObject !== media) v.srcObject = media;
    playVideo();
  };
  pc.onconnectionstatechange = () => {
    if (pc.connectionState === "connected") setLive(true);
    if (pc.connectionState === "failed" || pc.connectionState === "disconnected") streamFailed();
  };
  await pc.setRemoteDescription({ type: offer.sdpType, sdp: offer.sdp });
  await pc.setLocalDescription(await pc.createAnswer());
  // The host's WebRTC stack doesn't take candidates one by one: wait for all of them.
  await new Promise((resolve) => {
    if (pc.iceGatheringState === "complete") return resolve();
    const done = () => pc.iceGatheringState === "complete" && resolve();
    pc.addEventListener("icegatheringstatechange", done);
    setTimeout(resolve, 3000);
  });
  ws.send(JSON.stringify({ type: "answer", sdp: pc.localDescription.sdp, sdpType: pc.localDescription.type }));
}

function playVideo() {
  const v = $("video");
  v.volume = parseFloat($("vol").value);
  v.muted = muted;
  v.play().then(() => $("unmute").classList.add("hidden")).catch(() => {
    // Some browsers only allow sound after a click.
    v.muted = true;
    v.play().catch(() => {});
    $("unmute").classList.remove("hidden");
  });
}

function setLive(on) {
  live = on;
  $("video").classList.toggle("hidden", !on);
  $("frame").classList.toggle("hidden", on);
  if (on) $("screen").classList.remove("hidden");
  updateFrames();
  placeOverlays();
  if (state) render();
}

function streamFailed() {
  stopStream();
  clearTimeout(retryTimer);
  retryTimer = setTimeout(startStream, 8000); // keep trying; still pictures meanwhile
}

// --- still pictures (when video can't connect) ----------------------------
function updateFrames() {
  const want = !!(state && state.pings) && !live;
  if (want === framesOn) return;
  framesOn = want;
  if (want) loadFrame();
}

function loadFrame() {
  if (!framesOn) return;
  const img = $("frame");
  fetch("/frame?token=" + encodeURIComponent(myToken) + "&t=" + Date.now(), { cache: "no-store" })
    .then((r) => (r.status === 200 ? r.blob() : null))
    .then((blob) => {
      if (blob && framesOn) {
        const old = img.src;
        img.src = URL.createObjectURL(blob);
        if (old.startsWith("blob:")) URL.revokeObjectURL(old);
        $("screen").classList.remove("hidden");
      }
      setTimeout(loadFrame, blob ? 300 : 1500);
    })
    .catch(() => setTimeout(loadFrame, 2000));
}

// --- keep overlays on the game picture's corners --------------------------------
function placeOverlays() {
  const el = live ? $("video") : $("frame");
  const sr = $("screen").getBoundingClientRect();
  const r = el.getBoundingClientRect();
  const w = live ? el.videoWidth : el.naturalWidth, h = live ? el.videoHeight : el.naturalHeight;
  let gl = 0, gt = 0, gb = 0;
  if (w && h && r.width && r.height) {
    const scale = Math.min(r.width / w, r.height / h);
    const cw = w * scale, ch = h * scale;
    gl = r.left - sr.left + (r.width - cw) / 2;
    gt = r.top - sr.top + (r.height - ch) / 2;
    gb = sr.bottom - (r.top + (r.height - ch) / 2 + ch);
  }
  const st = $("screen").style;
  st.setProperty("--gl", Math.max(0, gl) + "px");
  st.setProperty("--gt", Math.max(0, gt) + "px");
  st.setProperty("--gb", Math.max(0, gb) + "px");
}
new ResizeObserver(placeOverlays).observe($("screen"));
$("video").addEventListener("resize", placeOverlays);
$("video").addEventListener("loadedmetadata", placeOverlays);
$("frame").addEventListener("load", placeOverlays);

// --- pings & emotes ---------------------------------------------------------
function myColor() {
  const me = state && state.players.find((p) => p.id === myId);
  return (me && me.color) || "#7c6cff";
}

function picturePosition(ev, clamp) {
  // Where on the game picture the pointer is (0..1), ignoring letterbox bars.
  const el = live ? $("video") : $("frame");
  const r = el.getBoundingClientRect();
  const w = live ? el.videoWidth : el.naturalWidth, h = live ? el.videoHeight : el.naturalHeight;
  if (!w || !h) return null;
  const scale = Math.min(r.width / w, r.height / h);
  const cw = w * scale, ch = h * scale;
  const left = r.left + (r.width - cw) / 2, top = r.top + (r.height - ch) / 2;
  let x = (ev.clientX - left) / cw, y = (ev.clientY - top) / ch;
  if (clamp) { x = Math.min(1, Math.max(0, x)); y = Math.min(1, Math.max(0, y)); }
  if (x < 0 || x > 1 || y < 0 || y > 1) return null;
  const sr = $("screen").getBoundingClientRect();
  return { x, y, px: ev.clientX - sr.left, py: ev.clientY - sr.top };
}

function ping(ev) {
  if (overControls(ev)) return;
  if (!state || !state.pings || !ws || ws.readyState !== 1) return;
  const pos = picturePosition(ev);
  if (!pos) return;
  ws.send(JSON.stringify({ type: "ping", x: pos.x, y: pos.y }));
  const dot = document.createElement("span");
  dot.className = "ripple";
  dot.style.left = pos.px + "px";
  dot.style.top = pos.py + "px";
  dot.style.setProperty("--c", myColor());
  $("screen").appendChild(dot);
  setTimeout(() => dot.remove(), 700);
}

// --- drawing: click and drag on the picture ----------------------------------------
const DRAG_PX = 6, INK_LIFE = 3000, SEND_EVERY = 40;
let pen = null;            // the stroke being drawn right now
const inkStrokes = [];     // local preview: {color, pts: [{x, y}] (0..1), doneAt}

function overControls(ev) {
  return ev.target === $("unmute") || $("controls").contains(ev.target);
}

function sendInk(done) {
  if (!pen || !ws || ws.readyState !== 1) return;
  if (pen.pending.length || done) {
    ws.send(JSON.stringify({ type: "draw", id: pen.id, points: pen.pending.map((p) => [p.x, p.y]), done }));
    pen.pending = [];
  }
  pen.lastSend = performance.now();
}

$("screen").addEventListener("pointerdown", (ev) => {
  if (ev.button !== 0 || overControls(ev) || !state || !state.pings) return;
  const pos = picturePosition(ev);
  if (!pos) return;
  pen = { id: Math.random().toString(36).slice(2, 10), startX: ev.clientX, startY: ev.clientY,
          drawing: false, pending: [pos], lastSend: 0, local: { color: myColor(), pts: [pos], doneAt: 0 } };
  $("screen").setPointerCapture(ev.pointerId);
});

$("screen").addEventListener("pointermove", (ev) => {
  if (!pen) return;
  if (!pen.drawing) {
    if (Math.hypot(ev.clientX - pen.startX, ev.clientY - pen.startY) < DRAG_PX) return;
    pen.drawing = true;
    inkStrokes.push(pen.local);
    drawInk();
  }
  const pos = picturePosition(ev, true);
  if (!pos) return;
  pen.pending.push(pos);
  pen.local.pts.push(pos);
  if (pen.pending.length >= 60 || performance.now() - pen.lastSend > SEND_EVERY) sendInk(false);
});

function endPen(ev) {
  if (!pen) return;
  const p = pen;
  if (p.drawing) {
    sendInk(true);
    p.local.doneAt = performance.now();
  } else if (ev.type === "pointerup") {
    ping(ev);  // a click without dragging is a ping
  }
  pen = null;
}
$("screen").addEventListener("pointerup", endPen);
$("screen").addEventListener("pointercancel", endPen);

let inkFrame = 0;
function drawInk() {
  const canvas = $("ink");
  const sr = $("screen").getBoundingClientRect();
  if (canvas.width !== Math.round(sr.width) || canvas.height !== Math.round(sr.height)) {
    canvas.width = Math.round(sr.width);
    canvas.height = Math.round(sr.height);
  }
  const ctx = canvas.getContext("2d");
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const el = live ? $("video") : $("frame");
  const r = el.getBoundingClientRect();
  const w = live ? el.videoWidth : el.naturalWidth, h = live ? el.videoHeight : el.naturalHeight;
  const now = performance.now();
  for (let i = inkStrokes.length - 1; i >= 0; i--) {
    if (inkStrokes[i].doneAt && now - inkStrokes[i].doneAt > INK_LIFE) inkStrokes.splice(i, 1);
  }
  if (w && h) {
    const scale = Math.min(r.width / w, r.height / h);
    const ox = r.left - sr.left + (r.width - w * scale) / 2, oy = r.top - sr.top + (r.height - h * scale) / 2;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.lineWidth = Math.max(3, (h * scale) / 160);
    for (const st of inkStrokes) {
      const left = st.doneAt ? INK_LIFE - (now - st.doneAt) : INK_LIFE;
      ctx.globalAlpha = Math.min(1, left / 500);  // fade out in the last half second
      ctx.strokeStyle = st.color;
      ctx.beginPath();
      st.pts.forEach((pt, i) => {
        const X = ox + pt.x * w * scale, Y = oy + pt.y * h * scale;
        if (i) ctx.lineTo(X, Y); else ctx.moveTo(X, Y);
      });
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }
  cancelAnimationFrame(inkFrame);
  if (inkStrokes.length) inkFrame = requestAnimationFrame(drawInk);
}

// --- sound / chat controls: only when the cursor is near them -------------------------
document.addEventListener("pointermove", (ev) => {
  const c = $("controls");
  const r = c.getBoundingClientRect();
  const dx = Math.max(r.left - ev.clientX, 0, ev.clientX - r.right);
  const dy = Math.max(r.top - ev.clientY, 0, ev.clientY - r.bottom);
  c.classList.toggle("near", !pen && Math.hypot(dx, dy) < 90);
});
document.addEventListener("pointerleave", () => $("controls").classList.remove("near"));

// --- chat ----------------------------------------------------------------------
function addChat(m) {
  const log = $("chatLog");
  const empty = log.querySelector(".empty");
  if (empty) empty.remove();
  const atBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 40;
  const p = document.createElement("p");
  const last = log.lastElementChild;
  if (last && last.dataset.who === m.name) {
    // Same person again: no repeated name, just the next line under their last one.
    p.className = "msg cont";
    p.textContent = m.text;
  } else {
    p.className = "msg";
    const who = document.createElement("span");
    who.className = "who";
    who.style.color = m.color;
    who.textContent = (m.host ? "★ " : "") + m.name + ":";
    p.append(who, document.createTextNode(m.text));
  }
  p.dataset.who = m.name;
  log.appendChild(p);
  while (log.childElementCount > 200) log.firstChild.remove();
  if (atBottom) log.scrollTop = log.scrollHeight;  // don't yank people reading older messages
}

$("chatForm").addEventListener("submit", (e) => {
  e.preventDefault();
  const text = $("chatInput").value.trim();
  if (!text || !ws || ws.readyState !== 1) return;
  ws.send(JSON.stringify({ type: "chat", text }));
  $("chatInput").value = "";
});

// --- reading -----------------------------------------------------------------
function render() {
  const msg = state.message;
  applyChatVisibility();
  updateFrames();

  const me = state.players.find((p) => p.id === myId);
  const iRead = !!(me && me.read);
  // The corner hint doubles as the reading prompt: Space / Z / Enter marks the line as read.
  const hint = $("hint");
  hint.classList.toggle("need", !!msg && !iRead);
  hint.classList.toggle("done", !!msg && iRead);
  hint.textContent = msg ? (iRead ? "✓ Read" : "Space / Z = Read") : "";
  hint.classList.toggle("hidden", !hint.textContent);

  $("players").replaceChildren(...state.players.map((p) => {
    const li = document.createElement("li");
    li.textContent = (p.host ? "★ " : "") + p.name + (p.id === myId ? " (you)" : "");
    li.style.borderLeft = `4px solid ${p.color}`;
    // Without "hold the game", the host continues whenever they like: only friends are counted.
    if (msg && (state.blocking || !p.host)) li.className = p.read ? "read" : "wait";
    return li;
  }));

  $("status").textContent = "";
}

function sendRead() {
  if (!state || !state.message || state.advancing || !ws || ws.readyState !== 1) return;
  const me = state.players.find((p) => p.id === myId);
  if (me && me.read) return;
  ws.send(JSON.stringify({ type: "read", msgId: state.message.id }));
}

// --- toolbar: mute and chat toggles (remembered) --------------------------------
let muted = false, chatHidden = false;
try {
  muted = localStorage.getItem("rpgmt-muted") === "1";
  chatHidden = localStorage.getItem("rpgmt-chat-hidden") === "1";
} catch (e) {}

function applyMute() {
  $("video").muted = muted;
  $("muteBtn").textContent = muted ? "\u{1F507}" : "\u{1F50A}";
  $("muteBtn").classList.toggle("off", muted);
  try { localStorage.setItem("rpgmt-muted", muted ? "1" : "0"); } catch (e) {}
}

function applyChatVisibility() {
  const allowed = !state || state.chat !== false;  // the host can turn chat off for everyone
  $("chat").classList.toggle("hidden", !allowed || chatHidden);
  $("chatBtn").classList.toggle("hidden", !allowed);
  $("chatBtn").classList.toggle("off", chatHidden);
  try { localStorage.setItem("rpgmt-chat-hidden", chatHidden ? "1" : "0"); } catch (e) {}
}

$("muteBtn").onclick = () => { muted = !muted; applyMute(); if (!muted) playVideo(); };
$("chatBtn").onclick = () => { chatHidden = !chatHidden; applyChatVisibility(); requestAnimationFrame(placeOverlays); };
applyMute();
applyChatVisibility();

function join() {
  myCode = $("code").value.trim().toUpperCase();
  if (!myCode) {
    $("status").textContent = "Enter the lobby code from the host (it's at the end of their link).";
    $("code").focus();
    return;
  }
  rejected = false;
  myName = $("name").value.trim() || "Player";
  try { localStorage.setItem("rpgmt-name", myName); } catch (e) {}
  $("join").classList.add("hidden");
  $("game").classList.remove("hidden");
  $("status").textContent = "Connecting...";
  connect();
}

$("joinBtn").onclick = join;
$("name").addEventListener("keydown", (e) => { if (e.key === "Enter") join(); });
$("code").addEventListener("keydown", (e) => { if (e.key === "Enter") join(); });
$("unmute").onclick = () => playVideo();
$("vol").addEventListener("input", () => {
  $("video").volume = parseFloat($("vol").value);
  if (muted && parseFloat($("vol").value) > 0) { muted = false; applyMute(); }
  try { localStorage.setItem("rpgmt-volume", $("vol").value); } catch (e) {}
});
document.addEventListener("keydown", (e) => {
  const el = document.activeElement;
  const typing = el.tagName === "TEXTAREA" || (el.tagName === "INPUT" && el.type === "text");
  if ((e.key === " " || e.key === "Enter" || e.key === "z" || e.key === "Z") && !typing) {
    e.preventDefault();
    sendRead();
  }
});
if (params.get("name") && params.get("code")) join(); // opened from the RPGMT app: join right away
</script>
</body>
</html>
